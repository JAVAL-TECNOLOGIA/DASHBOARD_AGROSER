{% load static %}
{% include 'base/header.html' %}
{% include 'base/sidebar.html' %}

{% block css %}
<link href="{% static 'assets/plugins/DataTables/media/css/dataTables.bootstrap.min.css' %}" rel="stylesheet" />
<link href="{% static 'assets/plugins/DataTables/extensions/Responsive/css/responsive.bootstrap.min.css' %}" rel="stylesheet" />
<link href="{% static 'assets/plugins/bootstrap-datepicker/css/bootstrap-datepicker.css' %}" rel="stylesheet" />
<link href="{% static 'assets/plugins/bootstrap-datepicker/css/bootstrap-datepicker3.css' %}" rel="stylesheet" />
<link href="{% static 'assets/plugins/gritter/css/jquery.gritter.css' %}" rel="stylesheet" />
<script src="{% static 'assets/plugins/pace/pace.min.js' %}"></script>
{% endblock %}

<div id="content" class="content">
    <div class="panel panel-inverse">
        <div class="panel-heading">
            <h3 class="panel-title">Gestión de Unidades de Medida</h3>
        </div>
        <div class="panel-body"><br>
            <div class="row">
                <div class="col-md-2">
                    <button onclick="modal_create_unidad_medida()" class="btn btn-success" style="color:white;">
                        <i class="fa fa-plus"></i> Agregar Unidad de Medida
                    </button>
                </div>
            </div>
            <br>
            <div class="table-responsive">
                <table class="table table-hover m-b-0 text-inverse" id="tableListUnidadMedida">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Abreviatura</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalCreateUnidadMedida"></div>
<div class="modal fade" id="modalUpdateUnidadMedida"></div>
<div class="modal fade" id="modalDeleteUnidadMedida"></div>

{% include 'base/footer.html' %}

{% block js %}
<script src="{% static 'assets/plugins/bootstrap-datepicker/js/bootstrap-datepicker.js' %}"></script>
<script src="{% static 'assets/plugins/DataTables/media/js/jquery.dataTables.js' %}"></script>
<script src="{% static 'assets/plugins/DataTables/media/js/dataTables.bootstrap.min.js' %}"></script>
<script src="{% static 'assets/plugins/DataTables/extensions/Responsive/js/dataTables.responsive.min.js' %}"></script>
<script src="{% static 'assets/js/demo/table-manage-default.demo.js' %}"></script>
<script src="{% static 'assets/js/demo/form-plugins.demo.js' %}"></script>
<script src="{% static 'assets/plugins/masked-input/masked-input.min.js' %}"></script>
<script src="{% static 'assets/plugins/ionRangeSlider/js/ion-rangeSlider/ion.rangeSlider.min.js' %}"></script>
<script src="{% static 'assets/plugins/gritter/js/jquery.gritter.js' %}"></script>
<script src="{% static 'assets/plugins/bootstrap-sweetalert/sweetalert.min.js' %}"></script>
<script src="{% static 'assets/js/demo/ui-modal-notification.demo.min.js' %}"></script>

<script>
    $(document).ready(function(){
        App.init();
        cargarUnidadesMedidas();
    });

    function cargarUnidadesMedidas(){
        $.get('/presupuesto-agricola/unidad-medida/api/unidad-medida/', function(response){
            // Destruir DataTable si ya existe ANTES de cambiar el HTML
            if ($.fn.DataTable.isDataTable('#tableListUnidadMedida')) {
                $('#tableListUnidadMedida').DataTable().clear().destroy();
            }

            let tbody = '';
            response.data.forEach(function(unidadMedida){
                let estadoBadge = unidadMedida.ESTADO == 1 ? 
                    '<span class="badge badge-success">Activo</span>' : 
                    '<span class="badge badge-danger">Inactivo</span>';
                
                tbody += `<tr>
                    <td>${unidadMedida.ID_UNIDAD}</td>
                    <td>${unidadMedida.NOMBRE}</td>
                    <td><span class="badge badge-warning">${unidadMedida.NOM_CORTO}</span></td>
                    <td>${unidadMedida.DESCRIPCION || '-'}</td>
                    <td>${estadoBadge}</td>
                    <td>
                        <button class="btn btn-warning btn-xs" onclick="modal_update_unidad_medida(${unidadMedida.ID_UNIDAD})" title="Editar">
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-xs" onclick="modal_delete_unidad_medida(${unidadMedida.ID_UNIDAD})" title="Eliminar">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            });
            
            // Cambiar el HTML
            $('#tableListUnidadMedida tbody').html(tbody);
            
            // Recrear DataTable con pequeño delay para asegurar que el DOM esté listo
            setTimeout(function() {
                $('#tableListUnidadMedida').DataTable({
                    responsive: true,
                    destroy: true, // Permite recrear la tabla
                    language: {
                        url: '//cdn.datatables.net/plug-ins/1.10.25/i18n/Spanish.json'
                    },
                    order: [[0, 'asc']] // Ordenar por ID ascendente por defecto
                });
            }, 100);
            
        }).fail(function(xhr, status, error) {
            console.error('Error al cargar unidades de medidas:', error);
            swal('Error', 'No se pudieron cargar las unidades de medidas', 'error');
        });
    }

    function modal_create_unidad_medida(){
        let html = `<form id="formCreateUnidadMedida">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Agregar Unidad de Medida</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Nombre <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Kilogramo, Hectárea, etc." maxlength="50" required>
                            <small class="form-text text-muted">Máximo 50 caracteres</small>
                        </div>
                        <div class="form-group">
                            <label>Abreviatura <span class="text-danger">*</span></label>
                            <input type="text" name="nom_corto" class="form-control" placeholder="Ej: Kg, Ha, J, etc." maxlength="10" required>
                            <small class="form-text text-muted">Máximo 10 caracteres</small>
                        </div>
                        <div class="form-group">
                            <label>Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3" placeholder="Descripción adicional (opcional)"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Estado <span class="text-danger">*</span></label>
                            <select name="estado" class="form-control" required>
                                <option value="1" selected>Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" onclick="saveCreateUnidadMedida()">
                            <i class="fa fa-save"></i> Guardar
                        </button>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">
                            <i class="fa fa-times"></i> Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </form>`;

        $('#modalCreateUnidadMedida').html(html).modal('show');
        
        // Enfocar el primer campo
        setTimeout(function() {
            $('#formCreateUnidadMedida [name="nombre"]').focus();
        }, 500);
    }

    function saveCreateUnidadMedida(){
        let form = $('#formCreateUnidadMedida');
        let nombre = form.find('[name="nombre"]').val().trim();
        let nomCorto = form.find('[name="nom_corto"]').val().trim();
        let descripcion = form.find('[name="descripcion"]').val().trim();
        let estado = parseInt(form.find('[name="estado"]').val());

        if (!nombre) {
            swal('Error', 'El nombre es obligatorio', 'error');
            return;
        }
        if (!nomCorto) {
            swal('Error', 'La abreviatura es obligatoria', 'error');
            return;
        }

        let data = {
            nombre: nombre,
            nom_corto: nomCorto.toUpperCase(),
            descripcion: descripcion,
            estado: estado
        };

        $.ajax({
            url: '/presupuesto-agricola/unidad-medida/api/unidad-medida/',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response){
                $('#modalCreateUnidadMedida').modal('hide');
                swal('¡Éxito!', 'Unidad de medida registrada correctamente', 'success');
                // Esperar un poco para que el modal se cierre completamente
                setTimeout(function() {
                    cargarUnidadesMedidas();
                }, 300);
            },
            error: function(xhr, status, error){
                let errorMessage = 'Error al crear unidad de medida';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMessage = xhr.responseJSON.message;
                }
                console.error('Error:', xhr.responseText);
                swal('Error', errorMessage, 'error');
            }
        });
    }

    function modal_update_unidad_medida(id){
        $.get(`/presupuesto-agricola/unidad-medida/api/unidad-medida/${id}/`, function(response){
            let unidadMedida = response.data;

            let html = `<form id="formUpdateUnidadMedida">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h4 class="modal-title">Editar Unidad de Medida</h4>
                            <button type="button" class="close" data-dismiss="modal">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>ID Unidad</label>
                                <input type="number" name="id_unidad" class="form-control" value="${unidadMedida.ID_UNIDAD}" readonly/>
                            </div>
                            <div class="form-group">
                                <label>Nombre <span class="text-danger">*</span></label>
                                <input type="text" name="nombre" class="form-control" value="${unidadMedida.NOMBRE}" maxlength="50" required>
                                <small class="form-text text-muted">Máximo 50 caracteres</small>
                            </div>
                            <div class="form-group">
                                <label>Abreviatura <span class="text-danger">*</span></label>
                                <input type="text" name="nom_corto" class="form-control" value="${unidadMedida.NOM_CORTO}" maxlength="10" required>
                                <small class="form-text text-muted">Máximo 10 caracteres</small>
                            </div>
                            <div class="form-group">
                                <label>Descripción</label>
                                <textarea name="descripcion" class="form-control" rows="3">${unidadMedida.DESCRIPCION || ''}</textarea>
                            </div>
                            <div class="form-group">
                                <label>Estado <span class="text-danger">*</span></label>
                                <select name="estado" class="form-control" required>
                                    <option value="1" ${unidadMedida.ESTADO == 1 ? 'selected' : ''}>Activo</option>
                                    <option value="0" ${unidadMedida.ESTADO == 0 ? 'selected' : ''}>Inactivo</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" onclick="saveUpdateUnidadMedida(${id})">
                                <i class="fa fa-save"></i> Actualizar
                            </button>
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">
                                <i class="fa fa-times"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            </form>`;
            
            $('#modalUpdateUnidadMedida').html(html).modal('show');
            
            // Enfocar el primer campo editable
            setTimeout(function() {
                $('#formUpdateUnidadMedida [name="nombre"]').focus().select();
            }, 500);
        }).fail(function(xhr, status, error) {
            swal('Error', 'No se pudo cargar la información de la unidad de medida', 'error');
        });
    }

    function saveUpdateUnidadMedida(id){
        let form = $('#formUpdateUnidadMedida');
        let nombre = form.find('[name="nombre"]').val().trim();
        let nomCorto = form.find('[name="nom_corto"]').val().trim();
        let descripcion = form.find('[name="descripcion"]').val().trim();
        let estado = parseInt(form.find('[name="estado"]').val());

        if (!nombre) {
            swal('Error', 'El nombre es obligatorio', 'error');
            return;
        }
        if (!nomCorto) {
            swal('Error', 'La abreviatura es obligatoria', 'error');
            return;
        }

        let data = {
            nombre: nombre,
            nom_corto: nomCorto.toUpperCase(),
            descripcion: descripcion,
            estado: estado
        };

        $.ajax({
            url: `/presupuesto-agricola/unidad-medida/api/unidad-medida/${id}/`,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response){
                $('#modalUpdateUnidadMedida').modal('hide');
                swal('¡Éxito!', 'Unidad de medida actualizada correctamente', 'success');
                // Esperar un poco para que el modal se cierre completamente
                setTimeout(function() {
                    cargarUnidadesMedidas();
                }, 300);
            },
            error: function(xhr, status, error){
                let errorMessage = 'Error al actualizar unidad de medida';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMessage = xhr.responseJSON.message;
                }
                console.error('Error:', xhr.responseText);
                swal('Error', errorMessage, 'error');
            }
        });
    }

    function modal_delete_unidad_medida(id){
        let html = `<div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Eliminar Unidad de Medida</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="text-center">
                        <i class="fa fa-warning fa-4x text-warning"></i>
                        <h4 class="m-t-10">¿Estás seguro?</h4>
                        <p>Esta acción eliminará permanentemente esta unidad de medida.<br>
                        <strong>Esta acción no se puede deshacer.</strong></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" onclick="deleteUnidadMedida(${id})">
                        <i class="fa fa-trash"></i> Sí, Eliminar
                    </button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fa fa-times"></i> Cancelar
                    </button>
                </div>
            </div>
        </div>`;
        $('#modalDeleteUnidadMedida').html(html).modal('show');
    }

    function deleteUnidadMedida(id){
        $.ajax({
            url: `/presupuesto-agricola/unidad-medida/api/unidad-medida/${id}/`,
            type: 'DELETE',
            success: function(response){
                $('#modalDeleteUnidadMedida').modal('hide');
                swal('¡Eliminado!', 'Unidad de medida eliminada correctamente', 'success');
                // Esperar un poco para que el modal se cierre completamente
                setTimeout(function() {
                    cargarUnidadesMedidas();
                }, 300);
            },
            error: function(xhr, status, error){
                let errorMessage = 'Error al eliminar unidad de medida';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    errorMessage = xhr.responseJSON.message;
                }
                console.error('Error:', xhr.responseText);
                swal('Error', errorMessage, 'error');
            }
        });
    }
</script>
{% endblock %}

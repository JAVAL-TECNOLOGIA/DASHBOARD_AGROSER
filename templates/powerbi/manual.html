{% load static %}
{% include 'base/header.html' %}
{% block css %}
<style>
    .pdf-container {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
    }
    h3 {
        background-color: #242a30;
        color: #fff;
        padding: 15px;
        border-radius: 5px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }

    h3 i {
        margin-right: 10px;
    }

    .pdf-column {
        width: 30%;
        margin: 0 10px;
    }

    #pdfViewer {
        margin-top: 20px;
        width: 100%;
        height: 600px;
    }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha384-qYoQiDJZgRiJ6Zgr0FYJ32qSl+V+Kk3IIfrE1z9PhPvo23lZM+oj8QC5j2BXQkmz" crossorigin="anonymous">

{% endblock %}
{% include 'base/sidebar.html' %}
<!-- begin #content -->
<div id="content" class="content">
    <!-- begin panel -->
    <div class="panel panel-inverse">
        <!-- begin panel-body -->

        <div class="panel-body">
            <h3> <i class="fas fa-book"></i> &nbsp&nbsp MANUAL PARA LA GUIA DE REMISION</h3>
            <div class="pdf-container">
                <div class="pdf-column">
                    <button class="btn btn-success btn-block" onclick="loadAndDisplayPDF('{% static 'Pdfs/Manual01.pdf' %}')">
                        <i class="fas fa-book"></i> Guia Electrónica  
                    </button>
                </div>
                <div class="pdf-column">
                    <button class="btn btn-success btn-block" onclick="loadAndDisplayPDF('{% static 'Pdfs/Manual02.pdf' %}')">
                        <i class="fas fa-book"></i> Guia Remisión
                    </button>
                </div>
                
                
            </div>
            <div id="pdfViewer"></div>
        </div>
        <!-- end panel-body -->
    </div>
    <!-- end panel -->
</div>
<!-- end #content -->
{% include 'base/footer.html' %}
{% block js %}
<script src="{% static 'assets/plugins/bootstrap-sweetalert/sweetalert.min.js' %}"></script>
<script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
<script>
    $(document).ready(function () {
        App.init();
    });

    function loadAndDisplayPDF(pdfPath) {
        var pdfViewer = document.getElementById('pdfViewer');
        pdfViewer.innerHTML = '';

        var iframe = document.createElement('iframe');
        iframe.src = pdfPath;
        iframe.style.width = '100%';
        iframe.style.height = '600px';

        pdfViewer.appendChild(iframe);
    }
</script>
{% endblock %}

{% load static %}
{% include 'base/header.html' %}
{% block page %}
    Reporte de Horas del Personal
{% endblock %}
{% include 'base/sidebar.html' %}

<!-- CSS personalizado para las cabeceras -->
<style>
#reporte-table thead th {
    color: white !important;
    background-color: #343a40 !important;
    font-weight: bold;
    text-align: center;
    vertical-align: middle;
}

#reporte-table thead th:hover {
    color: white !important;
}

.dataTables_wrapper .dataTables_length,
.dataTables_wrapper .dataTables_filter,
.dataTables_wrapper .dataTables_info,
.dataTables_wrapper .dataTables_paginate {
    color: #333;
}
</style>

<div id="content" class="content">
    <!-- BEGIN panel -->
    <div class="panel panel-inverse">
        <div class="panel-heading">
            <h4 class="panel-title">Filtros de Búsqueda</h4>
            <div class="panel-heading-btn">
                <a href="javascript:;" class="btn btn-xs btn-icon btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
                <a href="javascript:;" class="btn btn-xs btn-icon btn-success" data-toggle="panel-reload"><i class="fa fa-redo"></i></a>
                <a href="javascript:;" class="btn btn-xs btn-icon btn-warning" data-toggle="panel-collapse"><i class="fa fa-minus"></i></a>
            </div>
        </div>
        <div class="panel-body">
            <form class="row gx-2" id="filter-form">
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="fecha_inicio" class="form-label">Desde</label>
                        <input type="date" class="form-control" id="fecha_inicio" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="fecha_fin" class="form-label">Hasta</label>
                        <input type="date" class="form-control" id="fecha_fin" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="regimen" class="form-label">Régimen</label>
                        <select id="regimen" class="form-control" required>
                            <option value="OBR" selected>Obrero</option>
                            <option value="GEN">General</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <div class="form-group w-100">
                        <button type="button" id="btn-actualizar" class="btn btn-primary w-100">
                            <i class="fas fa-search"></i> Actualizar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- END panel -->

    <!-- BEGIN panel -->
    <div class="panel panel-inverse">
        <div class="panel-heading">
            <h4 class="panel-title">Resultados del Reporte</h4>
            <div class="panel-heading-btn">
                <a href="javascript:;" class="btn btn-xs btn-icon btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
                <a href="javascript:;" class="btn btn-xs btn-icon btn-success" data-toggle="panel-reload"><i class="fa fa-redo"></i></a>
                <a href="javascript:;" class="btn btn-xs btn-icon btn-warning" data-toggle="panel-collapse"><i class="fa fa-minus"></i></a>
            </div>
        </div>
        <div class="panel-body">
            <div class="table-responsive">
                <table id="reporte-table" class="table table-striped table-bordered table-hover align-middle w-100" style="width: 100%;">
                    <thead class="table-dark">
                        <!-- La cabecera se genera dinámicamente -->
                    </thead>
                    <tbody>
                        <!-- Los datos se cargan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- END panel -->
</div>

{% include 'base/footer.html' %}

{% block js %}
<!-- DataTables CSS y JS -->
<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

<script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script src="{% static 'core/js/COSTOS/DonLuis/costos_rpt_horas_personal.js' %}"></script>
{% endblock %}

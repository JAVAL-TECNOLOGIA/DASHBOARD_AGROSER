		&lt;!&ndash; Estilos para aprobación masiva &ndash;&gt;
		<style>
			/* Estilos para checkboxes */
			.form-check {
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0;
			}

			.form-check-input {
				width: 18px;
				height: 18px;
				cursor: pointer;
				margin: 0;
			}

			.form-check-label {
				margin: 0;
				cursor: pointer;
			}

			/* Estilos para el botón de aprobación masiva */
			#btnAprobacionMasiva:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			#btnAprobacionMasiva:not(:disabled) {
				animation: pulse 2s infinite;
			}

			@keyframes pulse {
				0% {
					transform: scale(1);
				}
				50% {
					transform: scale(1.05);
				}
				100% {
					transform: scale(1);
				}
			}

			/* Estilos para el panel de selección */
			#panelSeleccion .alert {
				border-left: 4px solid #17a2b8;
			}

			/* Estilos para filas seleccionadas */
			.row-selected {
				background-color: #e3f2fd !important;
				border-left: 4px solid #2196f3;
			}

			/* Hover effect para checkboxes */
			.form-check-input:hover {
				transform: scale(1.1);
				transition: transform 0.2s ease;
			}

			/* Estilos para botones del panel de selección */
			.btn-outline-info:hover {
				background-color: #17a2b8;
				border-color: #17a2b8;
				color: white;
			}

			.btn-outline-secondary:hover {
				background-color: #6c757d;
				border-color: #6c757d;
				color: white;
			}

			/* Estilos para badges de estado */
			.badge-warning {
				background-color: #ffc107;
				color: #fff;
			}

			.badge-success {
				background-color: #28a745;
				color: white;
			}

			.badge-danger {
				background-color: #dc3545;
				color: white;
			}

			.badge-secondary {
				background-color: #6c757d;
				color: white;
			}

			/* Responsive adjustments */
			@media (max-width: 768px) {
				#panelSeleccion .alert {
					flex-direction: column !important;
					align-items: flex-start !important;
				}

					margin-top: 0.5rem;
				}

					width: 100%;
				}
			}

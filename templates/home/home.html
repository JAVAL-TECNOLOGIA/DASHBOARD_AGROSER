<style>
    #content {
        background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
        min-height: 100vh;
        padding: 20px;
    }
    
    .welcome-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        padding: 40px 30px;
        text-align: center;
        margin-bottom: 30px;
    }
    
    .welcome-container h1 {
        color: #2c3e50;
        font-size: 2.5rem;
        margin-bottom: 15px;
        font-weight: 700;
    }
    
    .welcome-container p {
        color: #6c757d;
        font-size: 1.2rem;
        margin-bottom: 0;
    }
    
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }
    
    .stat-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
        border-left: 4px solid #d4af37;
    }
    
    .stat-card h3 {
        color: #2c3e50;
        font-size: 1.8rem;
        margin-bottom: 10px;
        font-weight: 600;
    }
    
    .stat-card p {
        color: #6c757d;
        margin: 0;
    }
    
    /* Modal Styles */
    .survey-modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        animation: fadeIn 0.3s ease;
    }
    
    .modal-content {
        position: relative;
        background: white;
        margin: 3% auto;
        border-radius: 20px;
        width: 90%;
        max-width: 900px;
        max-height: 90vh;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideInDown 0.4s ease;
    }
    
    .modal-header {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        color: white;
        padding: 25px 30px;
        position: relative;
        overflow: hidden;
    }
    
    .modal-header::before {
        content: '📢';
        position: absolute;
        top: -10px;
        right: -10px;
        font-size: 4rem;
        opacity: 0.2;
        transform: rotate(15deg);
    }
    
    .modal-header h2 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .modal-header .badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
    }
    
    .modal-body {
        padding: 30px;
        text-align: center;
    }
    
    .announcement-text {
        font-size: 1.2rem;
        color: #2c3e50;
        margin-bottom: 25px;
        line-height: 1.6;
    }
    
    .highlight-box {
        background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
        border-left: 4px solid #f39c12;
        padding: 20px;
        border-radius: 10px;
        margin: 20px 0;
    }
    
    .highlight-box h4 {
        color: #d68910;
        margin: 0 0 10px 0;
        font-weight: 600;
    }
    
    .highlight-box p {
        color: #7d6608;
        margin: 0;
        font-weight: 500;
    }
    
    .modal-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 30px;
        flex-wrap: wrap;
    }
    
    .btn-survey {
        background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(46, 204, 113, 0.3);
    }
    
    .btn-survey:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
    }
    
    .btn-later {
        background: transparent;
        color: #6c757d;
        padding: 15px 30px;
        border: 2px solid #dee2e6;
        border-radius: 50px;
        font-size: 1.1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-later:hover {
        border-color: #6c757d;
        color: #495057;
    }
    
    .close-modal {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        font-size: 2rem;
        color: white;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.3s ease;
    }
    
    .close-modal:hover {
        opacity: 1;
    }
    
    .survey-iframe-modal {
        width: 100%;
        height: 500px;
        border: none;
        border-radius: 0 0 20px 20px;
    }
    
    .loading-indicator {
        text-align: center;
        padding: 40px;
        color: #6c757d;
    }
    
    .loading-spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-radius: 50%;
        border-top: 4px solid #e74c3c;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    .loading-indicator {
        text-align: center;
        padding: 40px;
        color: #6c757d;
    }
    
    .loading-spinner {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-radius: 50%;
        border-top: 4px solid #e74c3c;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    @keyframes slideInDown {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .modal-content {
            margin: 5% auto;
            width: 95%;
        }
        
        .modal-header {
            padding: 20px;
        }
        
        .modal-header h2 {
            font-size: 1.5rem;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-buttons {
            flex-direction: column;
            align-items: center;
        }
        
        .btn-survey, .btn-later {
            width: 100%;
            max-width: 300px;
        }
        
        .survey-iframe-modal {
            height: 400px;
        }
    }
</style>

    </div>                
</div>

{% load static %}


<!-- Modal SERVICIOS -->
<div class="modal fade" id="PresupuestoModalServicios" tabindex="2" role="dialog" aria-labelledby="PresupuestoModalServiciosLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" style="max-width: 60%; width: 60%;" role="document">
        <div class="modal-content">

            

            <div class="modal-header bg-dark text-white">
                
                <h5 class="modal-title text-white" id="PresupuestoModalServiciosLabel">GESTION DE USUARIOS</h5>
                
                <div class="panel-heading-btn">
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-default" data-click="panel-expand" title="Expandir"><i class="fa fa-expand"></i></a>
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-success" data-click="panel-reload" title="Recargar"><i class="fas fa-sync-alt"></i></a>
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-danger" data-click="panel-remove" title="Cerrar"><i class="fa fa-times"></i></a>
                </div>



            </div>




            <div class="modal-body">

                <div class="table-responsive">
                    <table class="table table-striped table-bordered  "  id="usuariosTable">
                        
                        <tbody>
                            <!-- Aquí se agregarán filas dinámicamente con JavaScript -->
                        </tbody>
                    </table>
                </div> 

            </div>
            
        </div>
    </div>
</div>
<!-- Fin Modal CAPEX -->

<!-- Modal para agregar nuevo presupuesto de CAPEX -->

<div class="modal fade" id="Modal_Mantenimiento_User" tabindex="-1" role="dialog" aria-labelledby="ModalServiciosLabel" aria-hidden="true">
    <div class="modal-dialog modal-l" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ModalServiciosLabel">Agregar Nuevo Usuario</h5>
                <button type="button" class="close text-bold" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">

              
                <form id="registerUserForm">
                    <div class="row" style="width: 100%;">
                        <div class="col-md-12">

                            <div class="form-group">
                                <label for="nombres">Nombres</label>
                                <input type="text" class="form-control" id="nombres" name="nombres" required
                                       maxlength="50" placeholder="Ingrese nombres">
                            </div>
                            
                            <div class="form-group">
                                <label for="dni">DNI</label>
                                <input type="number" class="form-control" id="dni" name="dni" required
                                       maxlength="8" placeholder="Ingrese DNI" 
                                       oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                       onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                            </div>

                            

                            <div class="form-group">
                                <label for="apaterno">Apellido Paterno</label>
                                <input type="text" class="form-control" id="apaterno" name="apaterno" required
                                       maxlength="50" placeholder="Ingrese apellido paterno">
                            </div>

                            <div class="form-group">
                                <label for="amaterno">Apellido Materno</label>
                                <input type="text" class="form-control" id="amaterno" name="amaterno" required
                                       maxlength="50" placeholder="Ingrese apellido materno">
                            </div>

                            <div class="form-group">
                                <label for="celular">Celular</label>
                                <input type="number" class="form-control" id="celular" name="celular" required
                                       placeholder="Ingrese número de celular"
                                       oninput="if(this.value.length > 9) this.value = this.value.slice(0,9)"
                                       onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                                       pattern="[0-9]{9}">
                            </div>

                            <div class="form-group">
                                <label for="fecha_naci">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" id="fecha_naci" name="fecha_naci" required>
                            </div>
                        </div>
                    </div>
                    <button type="submit" id="registerUserForm" class="btn btn-primary btn-block mt-3">Registrar Usuario</button>
                </form>


            </div>
        </div>
    </div>
</div>

<style>

    /*===================================================*/
    /* Estilos para la tabla de usuarios */
    /*===================================================*/
    /* Asegurar que la tabla ocupe todo el ancho */
   

    /*===================================================*/
    /* Estilos para el panel */
    /*===================================================*/

    /* Estilos para el modal en pantalla completa */
    .modal-fullscreen {
        padding: 0 !important;
    }

    .modal-fullscreen .modal-dialog {
        width: 100vw !important;
        max-width: none !important;
        height: 100vh !important;
        margin: 0 !important;
    }

    .modal-fullscreen .modal-content {
        height: 100% !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
    }
    /*===================================*/
    /* Estilos para los botones del panel */
    /*=====================================*/
    .panel-heading-btn {
        display: flex;
        gap: 5px;
    }

    .panel-heading-btn .btn-circle {
        width: 30px;
        height: 30px;
        padding: 6px 0;
        border-radius: 15px;
        text-align: center;
        font-size: 12px;
        line-height: 1.428571429;
    }

    .panel-heading-btn .btn-default {
        background-color: #f8f9fa;
        border-color: #ddd;
    }

    .panel-heading-btn .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }

    .panel-heading-btn .btn-danger {
        background-color: #dc3545;
        border-color: #dc3545;
    }

    /* Loader */
    .panel-loader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255,255,255,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    /* Mantener el sidebar visible */
    body.modal-open {
        overflow: hidden;
        padding-right: 0 !important;
    }


    /*===================================================*/
    /* Estilos para el botón de agregar servicio */
    /*===================================================*/

    .dt-buttons {
        display: flex;
        width: 100%;
        align-items: center;
    }
    
    .dt-buttons .btn-success:last-child {
        margin-left: auto;
    }

    .btn-agregar{
        width: 150px !important;
        margin-left: auto !important;
    }

    /* =================================================*/
    /* Estilos para anclar las columnas de N°, idproducto, descripcion*/
    /* =================================================*/
     
    .sticky-col-left {
        position: sticky !important;
        left: 0 !important;
        background-color: white !important;
        z-index: 1 !important;
        
    }
    
    .sticky-col-left-1 {
        left: 0 !important;
    }
    
    .sticky-col-left-2 {
        left: 60px !important;  /* Ancho de la columna N° */
    }
    
    .sticky-col-left-3 {
        left: 170px !important; /* Ancho de la columna N° + ID Producto */
    }
    
    /* Aseguramos que los encabezados tengan mayor z-index */
    thead th.sticky-col-left {
        z-index: 2 !important;
        
    }


    /*===================================================*/
    /* Estilos para el botón de recargar */
    /*===================================================*/
    .panel-loader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255,255,255,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    
    .panel-loader .spinner-border {
        width: 3rem;
        height: 3rem;
        color: #28a745;
    }
    
</style>



<!-- Fin Modal para agregar nuevo presupuesto de CAPEX -->
{% block js %}

<script>
    $(document).ready(function() {
        // Botón expandir
        $(document).ready(function() {
            // Obtener la referencia a la tabla
            var table = $('#usuariosTable').DataTable();
            
            // Botón expandir
            $('[data-click="panel-expand"]').click(function(e) {
                e.stopPropagation();
                
                var modal = $('#PresupuestoModalServicios');
                var modalDialog = modal.find('.modal-dialog');
                var modalContent = modal.find('.modal-content');
                
                if (modal.hasClass('modal-fullscreen')) {
                    // Restaurar tamaño original
                    modal.removeClass('modal-fullscreen');
                    modalDialog.css({
                        'max-width': '75%',
                        'width': '75%',
                        'height': 'auto',
                        'margin': '1.75rem auto',
                        'position': 'relative'
                    });
                    modalContent.css({
                        'height': 'auto'
                    });
                } else {
                    // Expandir a pantalla completa
                    modal.addClass('modal-fullscreen');
                    modalDialog.css({
                        'max-width': '100vw',
                        'width': '100vw',
                        'height': '100vh',
                        'margin': '0',
                        'position': 'fixed',
                        'top': '0',
                        'left': '0'
                    });
                    modalContent.css({
                        'height': '100vh'
                    });
                }
        
                // Ajustar columnas después de la transición
                setTimeout(function() {
                    table.columns.adjust();
                }, 200);
            });
        });
    
        // Botón recargar
        $('[data-click="panel-reload"]').click(function(e) {
            e.stopPropagation();
            var panel = $(this).closest('.modal-content');
            
            panel.append('<div class="panel-loader"><span class="spinner-border spinner-border-sm"></span></div>');
            
            setTimeout(function() {
                $('.panel-loader', panel).remove();
                cargarDatosServicios();
            }, 500);


           

        });
    
        // Botón cerrar
        $('[data-click="panel-remove"]').click(function(e) {
            e.stopPropagation();
            $('#PresupuestoModalServicios').modal('hide');
        });
    });
</script>


<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script src="{% static 'core/js/TICS/mantenimiento_user_dl.js' %}"></script>

{% endblock %}

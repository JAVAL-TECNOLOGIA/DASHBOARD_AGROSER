{% load static %}


<!-- Modal SERVICIOS -->
<div class="modal fade" id="modal_mant_trabajador" tabindex="2" role="dialog" aria-labelledby="PresupuestoModalServiciosLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" style="max-width: 80%; width: 80%;" role="document">
        <div class="modal-content">

            

            <div class="modal-header bg-dark text-white">
                
                <h5 class="modal-title text-white" id="PresupuestoModalServiciosLabel">TRABAJADORES</h5>
                
                <div class="panel-heading-btn">
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-default" data-click="panel-expand" title="Expandir"><i class="fa fa-expand"></i></a>
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-success" data-click="panel-reload" title="Recargar"><i class="fas fa-sync-alt"></i></a>
                    <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-danger" data-click="panel-remove" title="Cerrar"><i class="fa fa-times"></i></a>
                </div>

            </div>


            <div class="modal-body">

                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="trabajadoresTable" style="width: 100%; min-width: 850px;">
                        <thead>
                            <tr>
                                <th class="text-center" style="min-width: 50px">ID</th>
                                <th class="text-center" style="min-width: 200px">Nombre</th>
                                <th class="text-center" style="min-width: 120px">Cargo</th>
                                <th class="text-center" style="min-width: 100px">Área</th>
                                <th class="text-center" style="min-width: 150px">Gerencia</th>
                                <th class="text-center" style="min-width: 100px">Sede</th>
                                <th class="text-center" style="min-width: 150px">Empresa</th>
                                <th class="text-center" style="min-width: 80px">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- Aquí se agregarán filas dinámicamente con JavaScript -->
                        </tbody>
                    </table>
                </div> 

            </div>
            
        </div>
    </div>
</div>




<!-- Modal para Agregar/Editar Trabajador -->
<div class="modal fade" id="Modal_Mantenimiento_Trabajador" tabindex="-1" role="dialog" aria-labelledby="ModalTrabajadorLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="ModalTrabajadorLabel">Gestión de Trabajador</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="trabajadorForm">
                    <input type="hidden" id="idtrabajador" name="idtrabajador">
                    
                    <!-- Usuario -->
                    <div class="form-group">
                        <label for="idusuario">Usuario</label>
                        <select class="form-control" id="idusuario" name="idusuario" required>
                            <option value="">Buscar usuario...</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <!-- Cargo -->
                            <div class="form-group">
                                <label for="idcargo">Cargo</label>
                                <select class="form-control select2" id="idcargo" name="idcargo" required>
                                    <option value="">Seleccione un cargo</option>
                                </select>
                            </div>

                            <!-- Área -->
                            <div class="form-group">
                                <label for="idarea">Área</label>
                                <select class="form-control select2" id="idarea" name="idarea" required>
                                    <option value="">Seleccione un área</option>
                                </select>
                            </div>

                            <!-- Gerencia -->
                            <div class="form-group">
                                <label for="idgerencia">Gerencia</label>
                                <select class="form-control select2" id="idgerencia" name="idgerencia" required>
                                    <option value="">Seleccione una gerencia</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <!-- Sede -->
                            <div class="form-group">
                                <label for="idsede">Sede</label>
                                <select class="form-control select2" id="idsede" name="idsede" required>
                                    <option value="">Seleccione una sede</option>
                                </select>
                            </div>

                            <!-- Empresa -->
                            <div class="form-group">
                                <label for="idempresa">Empresa</label>
                                <select class="form-control select2" id="idempresa" name="idempresa" required>
                                    <option value="">Seleccione una empresa</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Fin Modal para agregar nuevo presupuesto de CAPEX -->
{% block js %}

<script>
    $(document).ready(function() {
        // Botón expandir
        $(document).ready(function() {
            // Obtener la referencia a la tabla
            var table = $('#usuariosTable').DataTable();
            
            // Botón expandir
            $('[data-click="panel-expand"]').click(function(e) {
                e.stopPropagation();
                
                var modal = $('#PresupuestoModalServicios');
                var modalDialog = modal.find('.modal-dialog');
                var modalContent = modal.find('.modal-content');
                
                if (modal.hasClass('modal-fullscreen')) {
                    // Restaurar tamaño original
                    modal.removeClass('modal-fullscreen');
                    modalDialog.css({
                        'max-width': '75%',
                        'width': '75%',
                        'height': 'auto',
                        'margin': '1.75rem auto',
                        'position': 'relative'
                    });
                    modalContent.css({
                        'height': 'auto'
                    });
                } else {
                    // Expandir a pantalla completa
                    modal.addClass('modal-fullscreen');
                    modalDialog.css({
                        'max-width': '100vw',
                        'width': '100vw',
                        'height': '100vh',
                        'margin': '0',
                        'position': 'fixed',
                        'top': '0',
                        'left': '0'
                    });
                    modalContent.css({
                        'height': '100vh'
                    });
                }
        
                // Ajustar columnas después de la transición
                setTimeout(function() {
                    table.columns.adjust();
                }, 200);
            });
        });
    
        // Botón recargar
        $('[data-click="panel-reload"]').click(function(e) {
            e.stopPropagation();
            var panel = $(this).closest('.modal-content');
            
            panel.append('<div class="panel-loader"><span class="spinner-border spinner-border-sm"></span></div>');
            
            setTimeout(function() {
                $('.panel-loader', panel).remove();
                cargarDatosServicios();
            }, 500);


           

        });
    
        // Botón cerrar
        $('[data-click="panel-remove"]').click(function(e) {
            e.stopPropagation();
            $('#PresupuestoModalServicios').modal('hide');
        });
    });
</script>
